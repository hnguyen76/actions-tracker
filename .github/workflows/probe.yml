name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Action Network reachability
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for league in nfl ncaaf nba; do
            curl -s -A "$UA" -o "$league.html" -w "$league picks %{http_code} %{size_download}\n" "https://www.actionnetwork.com/$league/picks"
            sleep 3
            curl -s -A "$UA" -o /dev/null -w "$league scoreboard %{http_code} %{size_download}\n" "https://api.actionnetwork.com/web/v2/scoreboard/$league?bookIds=15"
            sleep 3
          done
          echo "__NEXT_DATA__ count: $(grep -c __NEXT_DATA__ nfl.html)"
