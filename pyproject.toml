[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actions-tracker"
version = "0.1.0"
description = "Track Action Network expert picks against game results"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "pandas>=2.2", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actions_tracker = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
